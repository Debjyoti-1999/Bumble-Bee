# Application
spring.application.name=DatingApp
server.port=8080

# Profile used when none is set explicitly. Production must run with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# JPA / Hibernate - the schema is owned by Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# H2 console is opt-in per profile
spring.h2.console.enabled=false

# Auth - no defaults on purpose; startup fails if these aren't provided.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=PT24H
app.jwt.issuer=datingapp

# Comma-separated browser origins allowed to open /ws/chat
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}
