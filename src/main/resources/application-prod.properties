# Production: all connection details come from the environment.
# Add the JDBC driver for your database (e.g. org.postgresql:postgresql) and, for Flyway 10+,
# the matching flyway-database-* module (e.g. org.flywaydb:flyway-database-postgresql).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=false
